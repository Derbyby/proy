<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Invitación a la fiesta</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="index">

    <!-- ESCENA PRINCIPAL -->
    <div class="invitation-scene">

        <!-- ENCABEZADO -->
        <div class="header-background">
            <header>
                <img src="assets/first/xv.svg" class="XV header-image">
                <img src="assets/first/square1.svg" class="Square1 header-image">
                <img src="assets/first/name.svg" class="Name header-image">
            </header>
        </div>

        <!-- CABALLOS -->
        <footer>
            <img src="assets/svg/horse.svg" class="Horse footer-image">
        </footer>

        <!-- CUMPLEAÑERA -->
        <div class="birthday-girl">
            <img src="assets/svg/birthday-girl.svg" class="Birthday-Girl">
        </div>

        <!-- CABALLOS -->
        <footer>
            <img src="assets/svg/horse.svg" class="Horse2 footer-image">
        </footer>

        <!-- ESCENA SECUNDARIA -->
        <div class="background2">

            <img src="assets/second/fondo2.svg" class="Background2">

            <div class="background2-overlay">

                <img src="assets/second/address.svg" class="Address">
                <img src="assets/second/picture.svg" class="Birthday-Picture">
                <img src="assets/second/horses-circle.svg" class="Horses-Circle">
                <img src="assets/second/reception.svg" class="Reception">
                <img src="assets/second/adress-name.svg" class="AddressName">
                <img src="assets/second/button-address.svg" class="Button-Address">

            </div>
        </div>

        <!-- CABALLOS -->
        <footer>
            <img src="assets/svg/horse.svg" class="Horse2 footer-image">
        </footer>


    </div>

    <!-- AUDIO -->
    <div id="audio-container">
        <audio id="audio1" loop>
            <source src="assets/music/childlike_things.mp3" type="audio/mpeg">
        </audio>
        <button id="play-button" class="music-button" onclick="playMusic()">▶</button>
        <button id="pause-button" class="music-button" onclick="pauseMusic()">Ⅱ</button>
    </div>

    <script>

        // Abrir popup
        function openPopup() {
            document.getElementById("popup-frame").style.display = "block";
        }

        // Cerrar popup
        function closePopup() {
            document.getElementById("popup-frame").style.display = "none";
        }

        // Iniciar música con el primer clic
        const audio = document.getElementById("audio1");
        window.addEventListener("click", function () {
            if (audio && audio.paused) {
                audio.play().catch(error => {
                    console.log("No se pudo reproducir el audio");
                });
            }

        }, { once: true });

        const playButton = document.getElementById("play-button");
        const pauseButton = document.getElementById("pause-button");

        function updateMusicButtons() {
            playButton.style.display = audio.paused ? "inline-block" : "none";
            pauseButton.style.display = audio.paused ? "none" : "inline-block";
        }

        audio.addEventListener("play", updateMusicButtons);
        audio.addEventListener("pause", updateMusicButtons);
        updateMusicButtons();

        // Función para reproducir música
        function playMusic() {
            if (audio) {
                audio.play().catch(error => {
                    console.log("No se pudo reproducir el audio");
                });
            }
        }

        // Función para pausar música
        function pauseMusic() {
            if (audio) {
                audio.pause();
            }
        }
    </script>

</body>

</html>
